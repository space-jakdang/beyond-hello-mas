[project]
name = "beyond-hello-mas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "pyarrow>=19,<24",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
